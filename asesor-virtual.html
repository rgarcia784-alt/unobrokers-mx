<script>
(function(){
var API='https://asesor-uno-brokers.rgarcia784.workers.dev/';
var WA='https://wa.me/523339675255';
var T={
 es:{title:'Asesor virtual UNO Brokers',sub:'En línea · Guadalajara y Zapopan desde 1995',ph:'Pregúntame lo que quieras…',
  fine:'Asistente virtual con inteligencia artificial. Para una propuesta formal, un asesor te atiende por WhatsApp.',
  hello:'¡Hola! 👋 Soy el asesor virtual de **UNO Brokers**.\n\nPregúntame lo que quieras.',
  typing:'Escribiendo…',err:'No pude responder en este momento. Inténtalo de nuevo o escríbenos por WhatsApp.',wa:'Hablar con un asesor por WhatsApp',quick:'Temas rápidos',
  topics:['Quiero vender mi propiedad','Busco comprar casa o departamento','Quiero poner mi casa en renta','¿Cuánto vale mi propiedad?','¿Qué es la investigación de inquilinos?','Precios y plan de pagos de NARA Américas','¿Desde cuánto hay departamentos en VIVARIA 2360?','Quiero invertir desde $500 mil','Tengo un terreno','¿Dónde están ubicados?']},
 en:{title:'UNO Brokers virtual advisor',sub:'Online · Guadalajara and Zapopan since 1995',ph:'Ask me anything…',
  fine:'AI-powered virtual assistant. For a formal proposal, an advisor will assist you on WhatsApp.',
  hello:'Hi! 👋 I\'m the **UNO Brokers** virtual advisor.\n\nAsk me anything.',
  typing:'Typing…',err:'I couldn\'t answer right now. Please try again or message us on WhatsApp.',wa:'Talk to an advisor on WhatsApp',quick:'Quick topics',
  topics:['I want to sell my property','I want to buy a house or apartment','I want to rent out my home','What is my property worth?','What is tenant screening?','NARA Américas prices and payment plan','VIVARIA 2360 starting price','I want to invest from $500K MXN','I own land','Where are you located?']}
};
var lang='es',hist=[],busy=false;
var log=document.getElementById('log'),scroller=document.getElementById('scroller'),input=document.getElementById('q'),send=document.querySelector('.send');
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){
  var h=esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g,function(m,p,u){
    var label=/wa\.me/.test(u)?T[lang].wa:u.replace(/^https?:\/\/(www\.)?/,'');
    return p+'<a href="'+u+'" target="_blank" rel="noopener"'+(/wa\.me/.test(u)?' data-wa="1"':'')+'>'+label+'</a>';});
  return h.replace(/^\s*[-•]\s+/gm,'• ');
}
function add(cls,html){var d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;log.appendChild(d);scroller.scrollTop=scroller.scrollHeight;return d;}
function waBtn(){return '<div class="links"><a class="wa" href="'+WA+'" target="_blank" rel="noopener" data-wa="1">'+esc(T[lang].wa)+'</a></div>';}
function topicsHTML(){var h='<div class="links">';T[lang].topics.forEach(function(t){h+='<a href="#" data-q="'+esc(t)+'">'+esc(t)+'</a>';});return h+'</div>';}
async function ask(text){
  if(busy||!text.trim())return;
  busy=true;send.disabled=true;
  add('me',esc(text));
  hist.push({role:'user',content:text});
  var t=add('bot typing',esc(T[lang].typing));
  try{
    var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-24)})});
    var d=await r.json();
    t.remove();
    if(!r.ok||!d.reply)throw new Error(d.error||'error');
    hist.push({role:'assistant',content:d.reply});
    add('bot',fmt(d.reply));
    if(typeof gtag==='function')gtag('event','asesor_virtual_pregunta');
    if(typeof fbq==='function')fbq('trackCustom','AsesorVirtualPregunta');
  }catch(e){
    t.remove();hist.pop();
    add('bot',esc(T[lang].err)+waBtn());
  }
  busy=false;send.disabled=false;input.focus();
}
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var v=input.value;input.value='';closeTopics();ask(v);});
log.addEventListener('click',function(e){
  var q=e.target.closest('[data-q]');if(q){e.preventDefault();ask(q.getAttribute('data-q'));return;}
  if(e.target.closest('[data-wa]')){if(typeof fbq==='function')fbq('track','Contact');if(typeof gtag==='function')gtag('event','click_whatsapp');}
});
var topics=document.getElementById('topics'),qbtn=document.getElementById('qbtn'),topicsIn=document.getElementById('topicsIn');
function renderTopics(){topicsIn.innerHTML='';T[lang].topics.forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=function(){closeTopics();ask(t);};topicsIn.appendChild(b);});}
function closeTopics(){topics.classList.remove('open');qbtn.setAttribute('aria-expanded','false');}
qbtn.onclick=function(){var o=!topics.classList.contains('open');topics.classList.toggle('open',o);qbtn.setAttribute('aria-expanded',String(o));};
function setLang(l){
  lang=l;document.documentElement.lang=l;hist=[];
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l));});
  document.getElementById('t-title').textContent=T[l].title;document.getElementById('t-sub').textContent=T[l].sub;
  input.placeholder=T[l].ph;document.getElementById('t-fine').textContent=T[l].fine;qbtn.title=T[l].quick;
  renderTopics();log.innerHTML='';add('bot',fmt(T[l].hello));
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.lang);};});
setLang(/[?&]lang=en/.test(location.search)?'en':'es');
})();
</script>
